name: Deploy APEX to GitHub Pages

on:
  push:
    # La branche par défaut du dépôt, quel que soit son nom, plus la branche
    # de restauration de la PWA.
    branches:
      - main
      - master
      - claude/apex-musculation-pwa-9qx1jd
      - claude/apex-musculation-restore-b0sf29
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Le groupe est propre à chaque branche : un build de la branche de
  # développement ne doit JAMAIS annuler un déploiement de production en cours.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
